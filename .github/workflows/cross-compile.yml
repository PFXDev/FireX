name: Cross Compile

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# Every branch build republishes the same rolling `dev` tag, so an older run
# must not land after a newer one. Tag releases are isolated by their full ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_type == 'branch' && 'dev' || github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: Build Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      build_time: ${{ steps.meta.outputs.build_time }}
    steps:
      # Resolved once and reused, so every binary in a release reports the same
      # version and build time no matter which matrix leg produced it.
      - name: Resolve version metadata
        id: meta
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ "${GITHUB_REF}" == refs/heads/master || "${GITHUB_REF}" == refs/heads/main ]]; then
            DATE="$(date -u +'%Y%m%d')"
            RUN_NUM="$(printf '%04d' "${GITHUB_RUN_NUMBER}")"
            # The updater parses this shape to compare dev builds; changing it
            # here means changing parseDevTag in internal/updater.
            VERSION="dev-${RUN_NUM}-${DATE}-${SHORT_SHA}"
          else
            VERSION="dev"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Run Go tests
        run: go test -shuffle=on ./...

  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs:
      - meta
      - test
    strategy:
      fail-fast: false
      matrix:
        # Each target must match updater.targetName() exactly: the asset name
        # is firex-{goos}-{goarch}{ext}, and a name only one side knows about
        # is a permanent 404 for those machines.
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
          - target: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ""
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ""
          - target: windows-amd64
            goos: windows
            goarch: amd64
            ext: ".exe"
          - target: windows-arm64
            goos: windows
            goarch: arm64
            ext: ".exe"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Writes into internal/web/dist, which the Go build embeds.
      - name: Build frontend
        run: |
          npm ci --prefix web
          npm run build --prefix web

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist

          PKG="github.com/PFXDev/FireX/internal/version"
          BIN="firex-${{ matrix.target }}${{ matrix.ext }}"
          go build -trimpath \
            -ldflags="-s -w \
              -X ${PKG}.Version=${{ needs.meta.outputs.version }} \
              -X ${PKG}.Commit=${{ needs.meta.outputs.commit }} \
              -X ${PKG}.BuildTime=${{ needs.meta.outputs.build_time }}" \
            -o "dist/${BIN}" ./cmd/firex

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firex-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  release-dev:
    name: Publish Dev Release
    runs-on: ubuntu-latest
    needs:
      - meta
      - build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firex-*
          path: release
          merge-multiple: true

      # The updater's direct mode discovers releases through this file, so a
      # release without it is invisible to every client.
      - name: Add version metadata
        run: |
          set -euo pipefail
          cat > release/version.json <<'EOF'
          {
            "version": "${{ needs.meta.outputs.version }}",
            "commit": "${{ needs.meta.outputs.commit }}",
            "build_time": "${{ needs.meta.outputs.build_time }}",
            "tag": "dev"
          }
          EOF

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd release
          ls firex-* >/dev/null
          # Run inside the asset directory so the second column is a bare file
          # name, which is what the client matches on, and glob only the
          # binaries so the manifest never covers itself or version.json.
          sha256sum firex-* > SHA256SUMS
          cat SHA256SUMS

      - name: Refresh dev tag and prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Delete rather than edit, so binaries for a platform that was
          # dropped cannot linger in the asset set.
          gh release delete dev --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag || true
          git tag -f dev "${GITHUB_SHA}"
          git push --force origin refs/tags/dev
          # --latest=false keeps this prerelease from hijacking the
          # releases/latest redirect that the stable channel follows.
          gh release create dev release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Dev Build #${GITHUB_RUN_NUMBER} (${{ needs.meta.outputs.commit }})" \
            --notes "Dev build for ${GITHUB_SHA}" \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --latest=false

  release-prod:
    name: Publish Prod Release
    runs-on: ubuntu-latest
    needs:
      - meta
      - build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firex-*
          path: release
          merge-multiple: true

      - name: Add version metadata
        run: |
          set -euo pipefail
          cat > release/version.json <<'EOF'
          {
            "version": "${{ needs.meta.outputs.version }}",
            "commit": "${{ needs.meta.outputs.commit }}",
            "build_time": "${{ needs.meta.outputs.build_time }}",
            "tag": "${{ github.ref_name }}"
          }
          EOF

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd release
          ls firex-* >/dev/null
          sha256sum firex-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: true
          make_latest: true
          files: release/*

  cleanup-artifacts:
    name: Clean Up Old Artifacts
    needs:
      - build
      - release-dev
      - release-prod
    if: ${{ always() && !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete artifacts from previous runs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 },
            );

            const runStatus = new Map();
            for (const artifact of artifacts) {
              const runId = artifact.workflow_run?.id;
              if (!runId || runId === context.runId) continue;
              if (!runStatus.has(runId)) {
                const { data: run } = await github.rest.actions.getWorkflowRun({
                  owner,
                  repo,
                  run_id: runId,
                });
                runStatus.set(runId, run.status);
              }
              // Never delete an artifact a queued or in-progress run may still
              // need for its own release job.
              if (runStatus.get(runId) !== 'completed') continue;
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id,
              });
            }
